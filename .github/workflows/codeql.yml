name: "CodeQL Security Analysis"

on:
  push:
    branches: [ "codeql" ]

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'java-kotlin' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      if: matrix.language == 'java-kotlin'
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: 21

    - name: Setup CodeQL CLI
      if: matrix.language == 'java-kotlin'
      run: |
        wget -q https://github.com/github/codeql-cli-binaries/releases/latest/download/codeql-linux64.zip
        unzip -q codeql-linux64.zip
        echo "$GITHUB_WORKSPACE/codeql" >> $GITHUB_PATH

    - name: Create CodeQL Database
      if: matrix.language == 'java-kotlin'
      run: |
        codeql database create codeql-db \
          --language=java \
          --source-root=. \
          --overwrite \
          --command="./gradlew clean :shared:jvmJar :backend:jar :androidApp:assembleDebug --no-daemon --no-build-cache --no-configuration-cache"

    - name: Run CodeQL Analysis
      if: matrix.language == 'java-kotlin'
      run: |
        codeql database analyze codeql-db \
          --format=sarif-latest \
          --output=results.sarif \
          --sarif-category="/language:java-kotlin" \
          codeql/java-queries:codeql-suites/java-security-extended.qls

    - name: Upload CodeQL Results
      if: matrix.language == 'java-kotlin'
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: results.sarif
        category: "/language:java-kotlin"

